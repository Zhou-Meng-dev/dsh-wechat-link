# 首次扫码登录。
# 先 kubectl scale deploy/dsh-wechat-link --replicas=0（RWO PVC 不能同时挂两个 Pod）
# 再 apply 本 Job，kubectl logs -f job/dsh-wechat-link-login 获取二维码链接。
apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-wechat-link-login
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: login
          image: dsh-wechat-link:local
          imagePullPolicy: IfNotPresent
          args: ["login"]
          env:
            - name: TZ
              value: Asia/Hong_Kong
          envFrom:
            - secretRef:
                name: dsh-wechat-link-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/node
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dsh-wechat-link-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: home
          emptyDir:
            sizeLimit: 128Mi
